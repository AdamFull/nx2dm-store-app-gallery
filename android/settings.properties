# Read generically by settings.gradle.kts and android/app/build.gradle.kts's
# buildscript{} block - neither file names this module or Huawei by id; they
# just scan every modules/*/android/settings.properties present on disk.
# These four keys exist only because the Huawei AGConnect plugin has no
# plugins{} DSL marker artifact and its own internals need a version-catalog
# workaround - see modules/store_app_gallery/android/build.gradle.kts and
# modules/store/README.md's "AGConnect wiring" section for the full story.

# A Maven repository this module's Gradle-level integration needs resolved,
# both for its own plain dependencies and for the buildscript-classpath
# dependency below.
repository=https://developer.huawei.com/repo/

# A classpath dependency android/app/build.gradle.kts's buildscript{} block
# must add before this module's own android/build.gradle.kts can
# apply(plugin = "com.huawei.agconnect").
buildscriptClasspath=com.huawei.agconnect:agcp:1.9.6.300

# The Huawei AGConnect plugin determines the Android Gradle Plugin version by
# reading a plugin alias out of a version catalog literally named "libs" -
# settings.gradle.kts backfills exactly this alias/id pair into an otherwise
# empty "libs" catalog on this module's behalf.
catalogPluginAlias=android-application
catalogPluginId=com.android.application
